name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar FFmpeg y OpenSSL
        run: sudo apt-get update && sudo apt-get install -y ffmpeg openssl
      - name: Instalar y comprobar dependencias
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Ejecutar pruebas
        run: python -m pytest pruebas/ -q
