  { nombre = "estadistica", funcion = "estadistica", descripcion = "Calcula medidas sobre una lista de números: suma, media, mediana, mínimo, máximo, desviación estándar y total. Útil para resumir datos de una planilla sin inventar cifras.", parametros = { valores = "string" } },
