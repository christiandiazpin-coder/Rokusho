  { nombre = "sumar_fechas", funcion = "sumar_fechas", descripcion = "Suma o resta días, meses o años a una fecha (formato AAAA-MM-DD). Devuelve la fecha resultante y el día de la semana.", parametros = { fecha = "string", dias = "integer", meses = "integer", anios = "integer" } },
