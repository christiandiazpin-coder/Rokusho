<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Rokusho</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --papel: #F6F2E9;
    --papel-alto: #FCFAF5;
    --tinta: #17140F;
    --tinta-suave: #5A5245;
    --tinta-tenue: #6E6455;
    --linea: #E0D8C8;
    --brasa: #8E3517;
    --mono: "JetBrains Mono", "SF Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--papel);
    color: var(--tinta);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
    padding: 32px;
  }
  main { max-width: 560px; }
  .marca {
    display: inline-flex;
    align-items: baseline;
    gap: 7px;
    font-weight: 600;
    font-size: 1.02rem;
    margin-bottom: 40px;
    text-decoration: none;
    color: inherit;
  }
  .marca i {
    width: 5px; height: 5px;
    background: var(--brasa);
    border-radius: 50%;
    display: block;
    transform: translateY(-1px);
  }
  .codigo {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--brasa);
    display: block;
    margin-bottom: 14px;
  }
  h1 {
    font-size: clamp(1.7rem, 4vw, 2.4rem);
    line-height: 1.1;
    letter-spacing: -.03em;
    font-weight: 500;
    margin-bottom: 16px;
    text-wrap: balance;
  }
  p { color: var(--tinta-suave); margin-bottom: 28px; max-width: 46ch; }
  .acciones { display: flex; gap: 12px; flex-wrap: wrap; }
  .boton {
    display: inline-block;
    background: var(--brasa);
    color: #FDF9F2;
    padding: 14px 24px;
    border-radius: 2px;
    text-decoration: none;
    font-weight: 600;
    font-size: .95rem;
    border: 1px solid var(--brasa);
  }
  .boton--fantasma {
    background: transparent;
    color: var(--tinta);
    border-color: #94886B;
  }
  footer {
    margin-top: 48px;
    padding-top: 18px;
    border-top: 1px solid var(--linea);
    font-family: var(--mono);
    font-size: .72rem;
    color: var(--tinta-tenue);
  }
</style>
</head>
<body>
<main>
  <a class="marca" href="https://christiandiazpin-coder.github.io/Rokusho/">Rokusho <i></i></a>
  <span class="codigo">Error 404</span>
  <h1>Esta página no existe.</h1>
  <p>
    Puede que el enlace esté mal escrito o que el documento haya cambiado de lugar.
    La página de inicio tiene lo que buscabas: precios, cómo funciona y el informe de muestra.
  </p>
  <div class="acciones">
    <a class="boton" href="https://christiandiazpin-coder.github.io/Rokusho/">Ir al inicio</a>
    <a class="boton boton--fantasma" href="https://christiandiazpin-coder.github.io/Rokusho/muestra/ejemplo-informe.html">Ver el informe de muestra</a>
  </div>
  <footer>Rokusho · informes con fuente verificable</footer>
</main>
</body>
</html>
